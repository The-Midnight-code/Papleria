services:
  postgres:
    image: postgres:17
    container_name: papeleria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: papeleria
      POSTGRES_USER: papeleria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - papeleria_postgres_data:/var/lib/postgresql/data

volumes:
  papeleria_postgres_data:
